doctrine:
    dbal:
        url: '%env(resolve:DATABASE_URL)%'

        # IMPORTANT: PostgreSQL does not use utf8mb4 (MySQL only!)
        charset: UTF8

        # Default table options (safe for Postgres)
        default_table_options:
            charset: UTF8
            collate: en_US.utf8

    orm:
        auto_generate_proxy_classes: true
        naming_strategy: doctrine.orm.naming_strategy.underscore_number_aware
        auto_mapping: true
        mappings:
            App:
                is_bundle: false
                type: annotation
                dir: '%kernel.project_dir%/src/Entity'
                prefix: 'App\Entity'
                alias: App
